<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ClientFlow · Mini-CRM for freelancers</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="ClientFlow is a free mini-CRM for freelancers: track leads, proposals, projects and payments on one board, with earnings insights. No sign-up, works in your browser, English and Ukrainian."
    />
    <meta name="theme-color" content="#4f46e5" />
    <meta property="og:title" content="ClientFlow · Mini-CRM for freelancers" />
    <meta
      property="og:description"
      content="Track every client from first message to paid invoice. Free, no sign-up, English and Ukrainian."
    />
    <meta property="og:type" content="website" />
    <meta
      property="og:image"
      content="https://angular-clientflow.vercel.app/screenshots/pipeline-en-light.png"
    />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    />
    <script>
      // Set the saved theme and language before the app loads, to avoid a flash.
      try {
        var theme = JSON.parse(localStorage.getItem('clientflow:theme'));
        if (theme === 'light' || theme === 'dark') {
          document.documentElement.dataset.theme = theme;
        }
        var lang = JSON.parse(localStorage.getItem('clientflow:lang'));
        if (lang === 'en' || lang === 'uk') {
          document.documentElement.lang = lang;
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <app-root></app-root>
    <noscript>ClientFlow needs JavaScript to run.</noscript>
  </body>
</html>
