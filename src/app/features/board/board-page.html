@if (board(); as board) {
  <section class="board">
    <header class="board__head">
      <a
        routerLink="/pipelines"
        class="icon-btn"
        [attr.aria-label]="'board.back' | t"
        [title]="'board.back' | t"
      >
        <app-icon name="arrow-left" />
      </a>
      <h1 class="board__title">
        <app-inline-edit
          [value]="board.title"
          [label]="'board.name' | t"
          [maxLength]="60"
          (saved)="renameBoard($event)"
        />
      </h1>
      <label class="sr-only" for="board-currency">{{ 'board.currency' | t }}</label>
      <select
        id="board-currency"
        class="input currency"
        [value]="board.currency"
        (change)="setCurrency(currency.value)"
        #currency
      >
        @for (code of currencies; track code) {
          <option [value]="code" [selected]="code === board.currency">{{ code }}</option>
        }
      </select>
      <span class="board__spacer"></span>
      <a class="btn" [routerLink]="['/board', board.id, 'insights']">
        <app-icon name="chart" [size]="16" />
        <span class="hide-sm">{{ 'board.insights' | t }}</span>
      </a>
      <button
        type="button"
        class="btn btn--ghost"
        [title]="'board.exportCsv' | t"
        (click)="exportCsv()"
      >
        <app-icon name="download" [size]="16" />
        <span class="hide-md">{{ 'board.exportCsv' | t }}</span>
      </button>
      <button
        type="button"
        class="icon-btn icon-btn--danger"
        [attr.aria-label]="'board.delete' | t"
        [title]="'board.delete' | t"
        (click)="deleteBoard()"
      >
        <app-icon name="trash" />
      </button>
    </header>

    @if (summary(); as summary) {
      <app-kpi-strip class="board__kpis" [summary]="summary" />
    }

    <div class="toolbar">
      <div class="search">
        <app-icon name="search" [size]="16" />
        <label for="board-search" class="sr-only">{{ 'board.search' | t }}</label>
        <input
          #search
          id="board-search"
          type="search"
          class="input"
          autocomplete="off"
          [placeholder]="'board.search' | t"
          [value]="query()"
          (input)="query.set(search.value)"
        />
        @if (!query()) {
          <kbd class="search__key" aria-hidden="true">/</kbd>
        }
      </div>

      <div class="filters" role="group" [attr.aria-label]="'board.filterByLabel' | t">
        @for (label of board.labels; track label.id) {
          <button
            type="button"
            class="filter label label--{{ label.color }}"
            [class.filter--on]="isLabelSelected(label.id)"
            [attr.aria-pressed]="isLabelSelected(label.id)"
            (click)="toggleLabel(label.id)"
          >
            {{ label.name }}
          </button>
        }
      </div>

      @if (filtering()) {
        <button type="button" class="btn btn--ghost" (click)="clearFilters()">
          <app-icon name="x" [size]="16" />
          {{ 'board.clearFilters' | t }}
        </button>
        <span class="toolbar__hint">{{ 'board.dragPaused' | t }}</span>
      }
    </div>

    <div class="scroller" cdkScrollable>
      <div
        class="columns"
        cdkDropList
        cdkDropListOrientation="horizontal"
        [cdkDropListData]="board.columns"
        (cdkDropListDropped)="dropColumn($event)"
      >
        @for (column of board.columns; track column.id) {
          <app-board-column
            cdkDrag
            [cdkDragDisabled]="filtering()"
            [cdkDragStartDelay]="dragStartDelay"
            [column]="column"
            [labels]="board.labels"
            [currency]="board.currency"
            [filter]="filter()"
            [filtering]="filtering()"
            [connectedTo]="listIds()"
            [dragStartDelay]="dragStartDelay"
            (cardDropped)="dropCard($event)"
            (cardOpened)="editingCardId.set($event)"
            (cardAdded)="addCard(column.id, $event)"
            (renamed)="renameColumn(column.id, $event)"
            (kindChanged)="setColumnKind(column.id, $event)"
            (removed)="removeColumn(column.id)"
          />
        }
      </div>

      <form class="add-column" (submit)="$event.preventDefault(); addColumn(newColumn)">
        <label for="new-column" class="sr-only">{{ 'board.newStageLabel' | t }}</label>
        <input
          #newColumn
          id="new-column"
          class="input"
          maxlength="40"
          autocomplete="off"
          [placeholder]="'board.addStage' | t"
        />
        <button type="submit" class="btn">
          <app-icon name="plus" [size]="16" />
          {{ 'common.add' | t }}
        </button>
      </form>
    </div>
  </section>

  @if (editing(); as editing) {
    <app-card-dialog
      [card]="editing.card"
      [labels]="board.labels"
      [columnTitle]="editing.columnTitle"
      [currency]="board.currency"
      (saved)="saveCard(editing.card.id, $event)"
      (deleted)="deleteCard(editing.card.id)"
      (closed)="editingCardId.set(null)"
    />
  }
}
